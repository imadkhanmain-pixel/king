name: "🪄 Imad Khan — Windows 11 RDP"

on:
  workflow_dispatch:
    inputs:
      CODE:
        description: "Google Remote Desktop Code"
        required: true
      PIN:
        description: "CRD PIN (6+ digits)"
        required: false
        default: "123456"

jobs:
  automation:
    runs-on: windows-2025
    name: "🚀 Imad Khan Win11 Workstation"

    env:
      RAW_CODE: ${{ github.event.inputs.CODE }}
      PIN_INPUT: ${{ github.event.inputs.PIN }}
      PY_EXE: "C:\\hostedtoolcache\\windows\\Python\\3.14.2\\x64\\python.exe"
      PROTON_URL: "https://protonvpn.com/download/ProtonVPN_v4.3.11_x64.exe"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "🐍 Step 1: Initialize Python 3.14.2"
        run: |
          if (Test-Path $env:PY_EXE) {
              $pyDir = Split-Path $env:PY_EXE
              echo "$pyDir" >> $env:GITHUB_PATH
              echo "$pyDir\Scripts" >> $env:GITHUB_PATH
              Write-Host "✅ Python 3.14.2 localized."
          }

      - name: "📦 Step 2: Imad Khan Toolsuite"
        run: |
          & $env:PY_EXE -m pip install --upgrade pip
          & $env:PY_EXE -m pip install requests playwright httpx[http2]
          & $env:PY_EXE -m playwright install chromium
          Write-Host "✅ Python environment and Playwright ready."

      - name: "🛡️ Step 3: Proton VPN Deployment"
        run: |
          $vpnPath = Join-Path $env:TEMP "ProtonVPN_Setup.exe"
          Invoke-WebRequest -Uri $env:PROTON_URL -OutFile $vpnPath -UseBasicParsing
          Start-Process -FilePath $vpnPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Write-Host "✅ Proton VPN installed."

      - name: "🌐 Step 4: Google Remote Desktop Setup"
        run: |
          # Download and Install CRD
          $crdMsi = Join-Path $env:TEMP "crdhost.msi"
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $crdMsi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", $crdMsi, "/qn", "/norestart" -Wait
          
          # Extraction logic: works if you paste just the code OR the whole command
          $authCode = if ($env:RAW_CODE -match '--code="([^"]+)"') { $matches[1] } else { $env:RAW_CODE }
          
          $hostStarter = "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          
          Write-Host "🚀 Launching Remote Desktop..."
          & $hostStarter --code="$authCode" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name=$env:COMPUTERNAME --pin=$env:PIN_INPUT
          Write-Host "✅ Connection established."

      - name: "⏳ Step 5: Session Keep-Alive (5h 50m)"
        run: |
          Write-Host "==============================================="
          Write-Host "👤 OWNER: Imad Khan"
          Write-Host "🖥️ OS: Windows 11"
          Write-Host "⏱️ DURATION: 350 Minutes"
          Write-Host "==============================================="
          for ($i=1; $i -le 350; $i++) {
              $rem = 350 - $i
              Write-Host "Session Active. $rem minutes remaining..."
              Start-Sleep -Seconds 60
          }
