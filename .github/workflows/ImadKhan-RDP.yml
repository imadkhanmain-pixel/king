name: "🪄 Imad Khan — Windows 11 (16GB RAM) Precision"

on:
  workflow_dispatch:
    inputs:
      CODE:
        description: "Google Remote Desktop Code"
        required: true
      PIN:
        description: "CRD PIN (6+ digits)"
        required: false
        default: "123456"

jobs:
  automation:
    runs-on: windows-11-arm # 16GB RAM physical
    timeout-minutes: 340    # Total Mission Time (5h 40m)
    name: "🚀 Imad Khan 16GB Workstation"

    env:
      RAW_CODE: ${{ github.event.inputs.CODE }}
      PIN_INPUT: ${{ github.event.inputs.PIN }}
      PROTON_URL: "https://protonvpn.com/download/ProtonVPN_v4.3.11_x64.exe"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "🐍 Step 1: Install Python 3.14.2 (Arm64 Native)"
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          architecture: 'arm64'

      - name: "📦 Step 2: Provision Imad Khan Suite"
        run: |
          # Now that Python is in the PATH, we just call it normally
          python -m pip install --upgrade pip
          pip install requests playwright httpx[http2]
          playwright install chromium
          Write-Host "✅ Python 3.14.2 Environment Ready."

      - name: "🛡️ Step 3: Proton VPN Deployment"
        run: |
          $vpnPath = Join-Path $env:TEMP "ProtonVPN_Setup.exe"
          Invoke-WebRequest -Uri $env:PROTON_URL -OutFile $vpnPath -UseBasicParsing
          Start-Process -FilePath $vpnPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Write-Host "✅ VPN Ready."

      - name: "🌐 Step 4: Google Remote Desktop Setup"
        run: |
          $crdMsi = Join-Path $env:TEMP "crdhost.msi"
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $crdMsi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", $crdMsi, "/qn", "/norestart" -Wait
          
          # Extraction logic for code
          $authCode = if ($env:RAW_CODE -match '--code="([^"]+)"') { $matches[1] } else { $env:RAW_CODE }
          $hostStarter = "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          
          & $hostStarter --code="$authCode" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name=$env:COMPUTERNAME --pin=$env:PIN_INPUT
          Write-Host "✅ GCRD Host Started Successfully."

      - name: "⏳ Step 5: Mission Control Loop (340 Minutes)"
        run: |
          Write-Host "==============================================="
          Write-Host "👤 OWNER: Imad Khan"
          Write-Host "🕒 MISSION START: $(Get-Date)"
          Write-Host "🚀 STATUS: 16GB RAM ACTIVE"
          Write-Host "==============================================="
          
          for ($i=1; $i -le 340; $i++) {
              if ($i -eq 330) { Write-Host "✋ RELAY TRIGGER: 10 mins to shutdown." }
              if ($i -eq 335) { 
                  Write-Host "⏹️ SHUTDOWN COMMAND: Closing session."
                  shutdown /s /f /t 0
              }
              $rem = 340 - $i
              Write-Host "Minute: $i/340 ($rem remaining)"
              Start-Sleep -Seconds 60
          }
